<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi Primera Comunión · Francisco</title>

  <style>
    body{
      margin:0;
      background:#eef0f4;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }

    .wrap{
      max-width:700px;
      margin:auto;
      padding:20px;
    }

    .card{
      position:relative;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 14px 40px rgba(0,0,0,.18);
      background:#fff;
    }

    .card img{
      width:100%;
      height:auto;
      display:block;
    }

    /* 🔵 BOTÓN i (zona clicable) */
    .info-btn{
  position:absolute;
  right:4%;        /* antes 6% → un poco más hacia dentro */
  bottom:8%;       /* antes 10% → sube un poco */
  width:90px;      /* antes 60px */
  height:90px;     /* antes 60px */
  cursor:pointer;
}
@media (max-width:600px){
  .info-btn{
    width:110px;
    height:110px;
  }
}


    /* 📱 Móvil: botón un poco más grande */
    @media (max-width:600px){
      .info-btn{
        width:70px;
        height:70px;
        right:5%;
        bottom:12%;
      }
    }

    .back{
      display:block;
      margin:16px auto 0;
      max-width:700px;
      text-align:center;
      padding:14px 18px;
      border-radius:16px;
      background:#ffffff;
      box-shadow:0 10px 28px rgba(0,0,0,.12);
      text-decoration:none;
      color:#1f2d3d;
      font-weight:600;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <img src="portada.png" alt="Portada comunión">

      <!-- SOLO la i es clicable -->
      <a class="info-btn" href="info.html" aria-label="Ver información"></a>
    </div>

    <a class="back" href="./">← Volver al sobre</a>
  </div>
</body>
</html>
