<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi Primera Comunión · Francisco</title>
  <style>
    body{margin:0;background:#eef0f4;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;}
    .wrap{max-width:520px;margin:auto;padding:16px;}
    .card{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.18);background:#fff;}
    .card img{width:100%;display:block;}
    /* Zona clicable: ahora toda la portada (o luego la ajustamos al botón "i") */
    .hotspot{
      position:absolute; inset:0;
      display:block; cursor:pointer;
      background:transparent;
    }
    .back{
      display:block;
      margin:14px auto 0;
      max-width:520px;
      text-align:center;
      padding:12px 16px;
      border-radius:14px;
      background:#ffffff;
      box-shadow:0 10px 28px rgba(0,0,0,.12);
      text-decoration:none;
      color:#1f2d3d;
      font-weight:600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img src="portada.png" alt="Portada">
      <!-- Al tocar la portada, abre la hoja de datos -->
      <a class="hotspot" href="info.html" aria-label="Ver información"></a>
    </div>
    <a class="back" href="./">← Volver al sobre</a>
  </div>
</body>
</html>
