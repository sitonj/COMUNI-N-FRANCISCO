<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi Primera Comunión · Francisco</title>

  <style>
    body{
      margin:0;
      background:#eef0f4;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }

    /* 📐 Tamaño normal en ordenador */
    .wrap{
      max-width:700px;     /* antes 520px */
      margin:auto;
      padding:20px;
    }

    .card{
      position:relative;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 14px 40px rgba(0,0,0,.18);
      background:#fff;
    }

    .card img{
      width:100%;
      height:auto;
      display:block;
    }

    /* Zona clicable */
    .hotspot{
      position:absolute;
      inset:0;
      display:block;
      cursor:pointer;
      background:transparent;
    }

    .back{
      display:block;
      margin:16px auto 0;
      max-width:700px;
      text-align:center;
      padding:14px 18px;
      border-radius:16px;
      background:#ffffff;
      box-shadow:0 10px 28px rgba(0,0,0,.12);
      text-decoration:none;
      color:#1f2d3d;
      font-weight:600;
    }

    /* 📱 MÓVIL: un poco más grande */
    @media (max-width: 600px){
      .wrap{
        max-width:100%;    /* ocupa más ancho */
        padding:10px;      /* menos margen = letras más grandes */
      }

      .card{
        border-radius:18px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <img src="portada.png" alt="Portada">
      <!-- Al tocar la portada, abre la hoja de datos -->
      <a class="hotspot" href="info.html" aria-label="Ver información"></a>
    </div>

    <a class="back" href="./">← Volver al sobre</a>
  </div>
</body>
</html>
