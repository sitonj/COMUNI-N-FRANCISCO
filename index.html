<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Mi Primera Comunión · Francisco</title>

  <!-- Open Graph para WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mi Primera Comunión · Francisco">
  <meta property="og:description" content=" ">
  <meta name="description" content=" ">
  <meta property="og:image" content="https://sitonj.github.io/COMUNI-N-FRANCISCO/sobre.png?v=999">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

<style>
  body{
    margin:0;
    background:#eef0f4;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  }

  .wrap{
    max-width:900px;          /* MÁS ancho */
    margin:auto;
    padding:24px;
  }

  .card{
    position:relative;
    border-radius:26px;       /* bordes suaves */
    overflow:hidden;
    background:#fff;
    box-shadow:
      0 12px 30px rgba(0,0,0,.18),
      0 25px 60px rgba(0,0,0,.12); /* sombra elegante */
  }

  .card img{
    width:100%;
    height:auto;
    display:block;
  }

  /* Todo el sobre clicable */
  .hotspot{
    position:absolute;
    inset:0;
    display:block;
    cursor:pointer;
    z-index:10;
  }

  /* En móviles: aún más grande */
  @media (max-width: 600px){
    .wrap{
      max-width:100%;
      padding:12px;
    }
    .card{
      border-radius:22px;
    }
  }
</style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <img src="sobre.png" alt="Sobre invitación">
      <a class="hotspot" href="portada.html?v=2" aria-label="Ver invitación"></a>
    </div>
  </div>
</body>
</html>
