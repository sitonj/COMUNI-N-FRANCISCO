<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Mi Primera Comunión · Francisco</title>

  <!-- Open Graph para WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mi Primera Comunión · Francisco">
  <meta property="og:description" content=" ">
  <meta name="description" content=" ">
  <meta property="og:image" content="https://sitonj.github.io/COMUNI-N-FRANCISCO/sobre.png?v=999">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <style>
    /* Quitar márgenes y hacer que la página use todo el alto */
    html, body{
      height:100%;
      margin:0;
      background:#eef0f4;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }

    /* Contenedor a pantalla completa */
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0; /* 👈 SIN padding para que crezca */
    }

    /* La “tarjeta” ocupa casi todo el ancho de la pantalla */
    .card{
      position:relative;
      width:min(520px, 100vw); /* 👈 máximo 520px, si no, todo el ancho */
      margin:0;
      border-radius:0;         /* 👈 sin bordes redondeados = más grande */
      overflow:hidden;
      box-shadow:none;         /* 👈 sin sombra = más limpio y grande */
      background:transparent;
    }

    /* La imagen ocupa todo el ancho */
    .card img{
      width:100%;
      height:auto;
      display:block;
    }

    /* Todo el sobre clicable */
    .hotspot{
      position:absolute;
      inset:0;
      display:block;
      cursor:pointer;
      z-index:10;
      background:transparent;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <img src="sobre.png" alt="Sobre invitación">
      <a class="hotspot" href="portada.html?v=2" aria-label="Ver invitación"></a>
    </div>
  </div>
</body>
</html>
